# A string used to distinguish different Supabase projects on the same host
project_id = "hub-fitness-operator"

[api]
enabled = true
port = 54321
# intranet = schema privado; não listar aqui
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
