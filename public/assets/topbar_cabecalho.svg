    <rect x="1340" y="18" width="1" height="24" fill="#e5e7eb"/>
    <text x="1352" y="28" fill="#111827" font-size="10" font-weight="800">CFO Admin</text>
    <text x="1352" y="42" fill="#16a34a" font-size="9" font-weight="600">Acesso Total</text>
    <rect x="1404" y="16" width="28" height="28" rx="4" fill="#f3f4f6" stroke="#e5e7eb"/>
    <text x="1410" y="35" font-size="13">??</text>
