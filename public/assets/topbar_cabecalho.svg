<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 280" width="1440" height="280" style="font-family: system-ui, -apple-system, Segoe UI, sans-serif;">
  <defs>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="1440" height="280" fill="#F8F9FA"/>

  <!-- Sidebar context -->
  <rect x="0" y="0" width="220" height="280" fill="#1F3864"/>
  <text x="20" y="36" fill="#ffffff" font-size="14" font-weight="800">HUB-FITNESS</text>
  <text x="20" y="54" fill="#94a3b8" font-size="10">3PL Logistics Planner</text>
  <rect x="12" y="78" width="196" height="30" rx="6" fill="#ffffff22"/>
  <text x="24" y="97" fill="#e2e8f0" font-size="11" font-weight="600">M1 · Dashboard</text>
  <text x="24" y="132" fill="#94a3b8" font-size="11">M2 · DRE 24m</text>
  <text x="24" y="158" fill="#94a3b8" font-size="11">M4 · Caixa</text>
  <circle cx="24" cy="256" r="4" fill="#4ade80"/>
  <text x="36" y="260" fill="#94a3b8" font-size="10">Sessão: CFO · v3.5</text>

  <!-- ===================== TOPBAR ===================== -->
  <g id="topbar">
