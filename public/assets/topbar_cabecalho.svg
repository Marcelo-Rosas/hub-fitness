    <!-- LEFT: collapse -->
    <rect x="240" y="16" width="122" height="28" rx="8" fill="#f1f5f9"/>
    <g transform="translate(250,22)" stroke="#1F3864" stroke-width="1.7" stroke-linecap="round">
      <path d="M0 2h12M0 8h12M0 14h12"/>
    </g>
    <text x="270" y="34" fill="#334155" font-size="11" font-weight="700">Colapse Sidebar</text>

    <!-- LEFT: cenário -->
    <rect x="372" y="16" width="150" height="28" rx="4" fill="#FFFBEB" stroke="#fde68a"/>
    <text x="382" y="34" fill="#6b7280" font-size="11">Cenário:</text>
    <text x="430" y="34" fill="#111827" font-size="11" font-weight="800">Baseline v3.5</text>
    <path d="M508 28l4 5 4-5" fill="none" stroke="#6b7280" stroke-width="1.4"/>

    <!-- LEFT: + Novo -->
    <rect x="532" y="16" width="64" height="28" rx="4" fill="#1F3864"/>
    <text x="544" y="34" fill="#ffffff" font-size="11" font-weight="600">? Novo</text>

    <!-- LEFT: Comparar -->
    <rect x="606" y="16" width="86" height="28" rx="4" fill="#fff" stroke="#e5e7eb"/>
    <text x="616" y="34" fill="#4b5563" font-size="11" font-weight="600">? Comparar</text>

    <!-- LEFT: Assistente IA -->
    <rect x="702" y="16" width="126" height="28" rx="4" fill="#f59e0b"/>
    <text x="712" y="34" fill="#0f172a" font-size="11" font-weight="800">? Assistente CFO IA</text>

    <!-- LEFT: PDF Global -->
    <rect x="838" y="16" width="128" height="28" rx="4" fill="#006100"/>
    <text x="848" y="34" fill="#ffffff" font-size="11" font-weight="800">Relatório PDF Global</text>

    <!-- LEFT: Relatório módulo -->
    <rect x="976" y="16" width="100" height="28" rx="4" fill="#047857"/>
    <text x="986" y="34" fill="#d1fae5" font-size="11" font-weight="800">?? Relatório M1</text>

    <!-- LEFT: Onboarding (compact) -->
    <rect x="1086" y="16" width="48" height="28" rx="4" fill="#2563eb"/>
    <text x="1100" y="34" fill="#ffffff" font-size="11" font-weight="800">Guia</text>

