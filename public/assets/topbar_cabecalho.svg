    <text x="1150" y="34" fill="#9ca3af" font-size="9" font-weight="800" letter-spacing="0.6">PITCH</text>
    <rect x="1190" y="20" width="36" height="18" rx="9" fill="#e5e7eb"/>
    <circle cx="1199" cy="29" r="7" fill="#fff"/>
    <text x="1214" y="33" fill="#9ca3af" font-size="7" font-weight="800">OFF</text>

    <!-- RIGHT: Exportar -->
