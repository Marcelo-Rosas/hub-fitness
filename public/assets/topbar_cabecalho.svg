  <!-- Dropdown Export (preview aberto) -->
  <g transform="translate(1120, 68)" filter="url(#drop)">
    <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#e5e7eb"/>
    <text x="14" y="28" fill="#047857" font-size="11" font-weight="800">?? Baixar Relatório PDF</text>
    <text x="14" y="54" fill="#374151" font-size="11">?? Ir para Exportação M9</text>
    <text x="14" y="80" fill="#166534" font-size="11" font-weight="700">?? Planilha CSV / XLSX</text>
    <line x1="12" y1="94" x2="208" y2="94" stroke="#f3f4f6"/>
    <text x="14" y="116" fill="#1d4ed8" font-size="11" font-weight="700">? Google Drive</text>
    <text x="14" y="140" fill="#374151" font-size="11">?? Link Leitura (72h)</text>
  </g>

  <!-- Content placeholder -->
  <rect x="244" y="90" width="820" height="150" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="268" y="130" fill="#1F3864" font-size="16" font-weight="800">TopBar · cabeçalho refatorado</text>
  <text x="268" y="154" fill="#64748b" font-size="12">Componente: src/components/TopBar.tsx</text>
  <text x="268" y="176" fill="#64748b" font-size="12">Uso: Shell importa TopBar e passa callbacks dos modais</text>
  <text x="268" y="206" fill="#94a3b8" font-size="11">Esquerda: menu · cenário · ações · IA · PDF · relatório · guia</text>
  <text x="268" y="224" fill="#94a3b8" font-size="11">Direita: Pitch Mode · Exportar · perfil/role</text>
