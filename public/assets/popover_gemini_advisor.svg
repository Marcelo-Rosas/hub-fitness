    <text x="50" y="155" fill="#cbd5e1" font-size="13">1. Margem de EBITDA 22,8% é consistente com operações 3PL de alto valor agregado.</text>
    <text x="50" y="185" fill="#cbd5e1" font-size="13">2. Ponto Crítico de Caixa identificado no M31 (R$ 1,51M), com recuperação rápida.</text>
    <text x="50" y="215" fill="#34d399" font-size="13" font-weight="700">3. Conformidade do Fator R em 28,4% garante enquadramento no Anexo III do Simples.</text>
    <text x="50" y="245" fill="#cbd5e1" font-size="13">4. Recomenda-se manter a reserva de contingência para flutuações de demanda no M12.</text>

