  <!-- Gemini Advisor Modal -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="700" height="500" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="2" />
    
    <!-- Modal Header -->
