<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" />
  <text x="30" y="38" fill="#38bdf8" font-size="20" font-weight="800">HUB-SIM v3.5</text>
  <text x="170" y="38" fill="#94a3b8" font-size="16" font-weight="500">| Inspeção de Célula &amp; Rastreamento de Fórmulas (Auditoria)</text>

  <!-- Background App Screen -->
  <rect x="30" y="80" width="1140" height="565" rx="12" fill="#1e293b" opacity="0.4" />

  <!-- Popover Drawer / Modal Overlay -->
  <g transform="translate(700, 80)">
    <rect x="0" y="0" width="470" height="565" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    
    <text x="25" y="45" fill="#38bdf8" font-size="16" font-weight="800">🔍 INSPECTOR DE CÉLULA CONTÁBIL</text>
    <text x="25" y="70" fill="#cbd5e1" font-size="12">Análise de Dependências &amp; Fórmula Origem</text>

    <rect x="25" y="90" width="420" height="80" rx="8" fill="#1e293b" />
    <text x="40" y="115" fill="#94a3b8" font-size="11">CÉLULA SELECIONADA</text>
    <text x="40" y="142" fill="#34d399" font-size="20" font-weight="800">Margem EBITDA M36 (22,8%)</text>

    <rect x="25" y="185" width="420" height="110" rx="8" fill="#1e293b" />
    <text x="40" y="210" fill="#38bdf8" font-size="12" font-weight="700">FÓRMULA MATEMÁTICA APLICADA</text>
    <text x="40" y="238" fill="#f8fafc" font-size="14" font-family="monospace">= (EBITDA_M36 / RECEITA_BRUTA_M36) * 100</text>
    <text x="40" y="268" fill="#cbd5e1" font-size="11">=(R$ 117.200 / R$ 514.200) * 100 = 22,79%</text>

    <rect x="25" y="310" width="420" height="220" rx="8" fill="#1e293b" />
    <text x="40" y="335" fill="#fbbf24" font-size="12" font-weight="700">ÁRVORE DE DEPENDÊNCIAS DE ENTRADA</text>
    <text x="40" y="365" fill="#cbd5e1" font-size="12">1. Receita Armazenagem P1-P5 [Drivers VAS M3]</text>
    <text x="40" y="390" fill="#cbd5e1" font-size="12">2. Dedução DAS Simples Nacional (6%) [M5 Fator R]</text>
    <text x="40" y="415" fill="#cbd5e1" font-size="12">3. Custos Operacionais Mão de Obra [M15 RH Benchmark]</text>
    <text x="40" y="440" fill="#cbd5e1" font-size="12">4. Aluguel Galpão Itajaí/SC [M10 Compras/Cotações]</text>
  </g>
