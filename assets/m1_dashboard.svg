<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" />
  <text x="30" y="38" fill="#38bdf8" font-size="20" font-weight="800">HUB-SIM v3.5</text>
  <text x="170" y="38" fill="#94a3b8" font-size="16" font-weight="500">| M1: Dashboard Executivo - Board 3PL Fitness Itajaí</text>
  <rect x="1020" y="18" width="150" height="28" rx="6" fill="#0284c7" />
  <text x="1042" y="37" fill="#ffffff" font-size="12" font-weight="700">✓ AUDITADO v3.5</text>

  <!-- KPI Cards Row -->
  <g transform="translate(30, 80)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="265" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="20" y="32" fill="#94a3b8" font-size="12" font-weight="600">RECEITA BRUTA M36</text>
    <text x="20" y="68" fill="#f8fafc" font-size="24" font-weight="800">R$ 514,2k</text>
    <text x="20" y="92" fill="#34d399" font-size="11" font-weight="600">▲ 100% Capacidade Galpão</text>

    <!-- Card 2 -->
    <rect x="285" y="0" width="265" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="305" y="32" fill="#94a3b8" font-size="12" font-weight="600">MARGEM EBITDA LÍQUIDA</text>
    <text x="305" y="68" fill="#38bdf8" font-size="24" font-weight="800">22,8%</text>
    <text x="305" y="92" fill="#38bdf8" font-size="11" font-weight="600">✓ Margem de Segurança SANCO</text>

    <!-- Card 3 -->
    <rect x="570" y="0" width="265" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="590" y="32" fill="#94a3b8" font-size="12" font-weight="600">VALE DE CAIXA MÍNIMO (M31)</text>
    <text x="590" y="68" fill="#fbbf24" font-size="24" font-weight="800">R$ 1,51M</text>
    <text x="590" y="92" fill="#fbbf24" font-size="11" font-weight="600">⚠ Ponto Crítico Pós-Empilhadeira</text>

    <!-- Card 4 -->
    <rect x="855" y="0" width="285" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="875" y="32" fill="#94a3b8" font-size="12" font-weight="600">CONFORMIDADE FATOR R</text>
    <text x="875" y="68" fill="#34d399" font-size="24" font-weight="800">28,4% (Anexo III)</text>
    <text x="875" y="92" fill="#34d399" font-size="11" font-weight="600">✓ Blindagem Fiscal ~R$ 270k/ano</text>
  </g>

  <!-- Charts Row -->
  <g transform="translate(30, 215)">
    <!-- Main Chart Box -->
    <rect x="0" y="0" width="750" height="420" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="35" fill="#f8fafc" font-size="16" font-weight="700">Evolução do Faturamento e Ebitda M1 ao M36 (R$)</text>
    
    <!-- Chart Grid Lines -->
    <line x1="60" y1="360" x2="710" y2="360" stroke="#334155" stroke-width="1" />
    <line x1="60" y1="290" x2="710" y2="290" stroke="#334155" stroke-dasharray="4" stroke-width="1" />
    <line x1="60" y1="220" x2="710" y2="220" stroke="#334155" stroke-dasharray="4" stroke-width="1" />
    <line x1="60" y1="150" x2="710" y2="150" stroke="#334155" stroke-dasharray="4" stroke-width="1" />
    <line x1="60" y1="80" x2="710" y2="80" stroke="#334155" stroke-dasharray="4" stroke-width="1" />

    <!-- Revenue Area / Line -->
    <path d="M 70 340 Q 200 310, 350 220 T 700 90 L 700 360 L 70 360 Z" fill="url(#blueGrad)" opacity="0.3" />
    <path d="M 70 340 Q 200 310, 350 220 T 700 90" fill="none" stroke="#38bdf8" stroke-width="3" />

    <!-- EBITDA Line -->
    <path d="M 70 355 Q 200 335, 350 270 T 700 180" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 2" />

    <defs>
      <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0284c7" />
        <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
      </linearGradient>
    </defs>

    <!-- Side Summary Box -->
    <rect x="775" y="0" width="365" height="420" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="800" y="35" fill="#f8fafc" font-size="16" font-weight="700">Resumo da Operação 3PL</text>
    
    <rect x="795" y="60" width="325" height="70" rx="8" fill="#0f172a" />
    <text x="810" y="85" fill="#94a3b8" font-size="11">Capacidade de Posições Palete</text>
    <text x="810" y="112" fill="#f8fafc" font-size="18" font-weight="700">2.100 Posições (100% M36)</text>

    <rect x="795" y="145" width="325" height="70" rx="8" fill="#0f172a" />
    <text x="810" y="170" fill="#94a3b8" font-size="11">Mix Operacional Previsto</text>
    <text x="810" y="197" fill="#38bdf8" font-size="18" font-weight="700">40% P1 | 35% P2 | 25% P3</text>

    <rect x="795" y="230" width="325" height="70" rx="8" fill="#0f172a" />
    <text x="810" y="255" fill="#94a3b8" font-size="11">Payback Simples Calculado</text>
    <text x="810" y="282" fill="#34d399" font-size="18" font-weight="700">14 Meses (Retorno Garantido)</text>

    <rect x="795" y="315" width="325" height="80" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1" />
    <text x="810" y="340" fill="#fbbf24" font-size="11" font-weight="700">⚠ ALERTA DE COMPLIANCE FISCAL</text>
    <text x="810" y="362" fill="#cbd5e1" font-size="11">Fator R monitorado para manter Anexo III (6%).</text>
  </g>
</svg>
