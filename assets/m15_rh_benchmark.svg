<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#090d16; font-family: system-ui, -apple-system, sans-serif;">
  <rect x="0" y="0" width="1200" height="60" fill="#0f172a" />
  <text x="30" y="38" fill="#38bdf8" font-size="20" font-weight="800">HUB-SIM v3.5</text>
  <text x="170" y="38" fill="#94a3b8" font-size="16" font-weight="500">| M15: Dimensionamento de RH, Salários &amp; Benchmark de Custos SC</text>

  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="1140" height="565" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="40" fill="#f8fafc" font-size="18" font-weight="700">Quadro de Operadores Logísticos &amp; Benchmark Salarial Região Itajaí / Navegantes</text>

    <!-- KPI Cards -->
    <rect x="30" y="70" width="340" height="150" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
    <text x="50" y="100" fill="#38bdf8" font-size="13" font-weight="800">CUSTO TOTAL FOLHA Y1</text>
    <text x="50" y="135" fill="#f8fafc" font-size="24" font-weight="800">R$ 48.200 / mês</text>
    <text x="50" y="165" fill="#cbd5e1" font-size="11">Inclui Encargos Sociais + FGTS + DSR</text>

    <rect x="400" y="70" width="340" height="150" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <text x="420" y="100" fill="#34d399" font-size="13" font-weight="800">HEADCOUNT PLANO BASE</text>
    <text x="420" y="135" fill="#f8fafc" font-size="24" font-weight="800">8 Operadores Ativos</text>
    <text x="420" y="165" fill="#cbd5e1" font-size="11">1 Gerente, 2 Op. Empilhadeira, 5 Aux. Picking</text>

    <rect x="770" y="70" width="340" height="150" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
    <text x="790" y="100" fill="#fbbf24" font-size="13" font-weight="800">PRO-LABORE SOCIOS</text>
