    <text x="50" y="310" fill="#cbd5e1" font-size="12">• Operador de Empilhadeira VNA/Retrátil: R$ 2.850,00 + Periculosidade</text>
    <text x="50" y="335" fill="#cbd5e1" font-size="12">• Auxiliar de Armazém e Conferente: R$ 2.100,00 + Vale Alimentação</text>
    <text x="50" y="360" fill="#cbd5e1" font-size="12">• Supervisor de Operações 3PL: R$ 5.800,00 + Bônus de Produtividade</text>
